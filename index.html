<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEEE EMBS Digital Inauguration</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle,#0b1e3f,#020b1f);
color:white;
text-align:center;
overflow-x:hidden;
}

h1{
margin-top:40px;
font-size:40px;
letter-spacing:2px;
}

/* Lamps */

.lamps{
margin-top:60px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
}

.lamp{
font-size:70px;
cursor:pointer;
transition:0.3s;
}

.lamp:hover{
transform:scale(1.2);
}

.flame{
width:15px;
height:30px;
margin:auto;
background:linear-gradient(yellow,orange,red);
border-radius:50%;
animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
0%{transform:scale(1)}
100%{transform:scale(1.2)}
}

/* Text */

.reveal{
margin-top:40px;
font-size:28px;
opacity:0;
transition:1.5s;
}

/* Logo section */

#logoSection{
margin-top:80px;
display:none;
}

.shield{
width:250px;
opacity:0;
transform:scale(0);
}

/* Shield assembling animation */

@keyframes assemble{

0%{
opacity:0;
transform:scale(0) rotate(-180deg);
}

100%{
opacity:1;
transform:scale(1) rotate(0);
}

}

/* Confetti */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<h1>Digital Inauguration Ceremony</h1>

<div class="lamps">

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

<div onclick="lightLamp(this)" class="lamp">🪔<div></div></div>

</div>

<div class="reveal" id="textReveal">

Kalasalingam Academy of Research and Education  
<br><br>
IEEE Student Branch  
<br><br>
KARE IEEE EMBS Student Chapter

</div>

<div id="logoSection">

<img id="logo" class="shield" src="logo.jpeg">

</div>

<canvas id="confetti"></canvas>

<script>

/* Lamp lighting */

let count=0

function lightLamp(lamp){

if(lamp.classList.contains("lit")) return

lamp.classList.add("lit")

lamp.innerHTML="🪔<div class='flame'></div>"

count++

if(count==6){

document.getElementById("textReveal").style.opacity=1

setTimeout(showLogo,2000)

}

}

/* Logo assemble */

function showLogo(){

let logo=document.getElementById("logo")

document.getElementById("logoSection").style.display="block"

logo.style.animation="assemble 3s forwards"

startConfetti()

}

/* Confetti */

const canvas=document.getElementById("confetti")

const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

function startConfetti(){

for(let i=0;i<150;i++){

pieces.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*6,
speed:Math.random()*3

})

}

animate()

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle="gold"

ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

if(p.y>canvas.height)p.y=0

})

requestAnimationFrame(animate)

}

</script>

</body>
</html>
