<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEEE EMBS Digital Inauguration</title>

<!-- Professional Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins', sans-serif;
background:radial-gradient(circle,#0b1e3f,#020b1f);
color:white;
text-align:center;
overflow-x:hidden;
}

/* Title */

h1{
margin-top:30px;
font-size:44px;
font-family:'Playfair Display', serif;
letter-spacing:2px;
}

/* College Logo */

.collegeLogo{
margin-top:30px;
width:260px;
filter:drop-shadow(0 0 15px rgba(255,255,255,0.2));
animation:fadeDown 2s ease;
}

@keyframes fadeDown{
0%{opacity:0; transform:translateY(-30px);}
100%{opacity:1;}
}

/* Lamps */

.lamps{
margin-top:60px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:40px;
}

.lamp{
font-size:80px;
cursor:pointer;
transition:0.3s;
}

.lamp:hover{
transform:scale(1.15);
}

/* Flame */

.flame{
width:15px;
height:30px;
margin:auto;
background:linear-gradient(yellow,orange,red);
border-radius:50%;
animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
0%{transform:scale(1)}
100%{transform:scale(1.2)}
}

/* Text */

#textReveal{
margin-top:60px;
font-size:26px;
opacity:0;
transition:2s;
line-height:1.8;
font-weight:400;
}

/* Logo Section */

#logoSection{
margin-top:80px;
display:none;
}

.logoContainer{
display:inline-block;
padding:20px;
}

/* EMBS Logo */

#logo{
width:240px;
opacity:0;
transform:scale(0.4);
border-radius:10px;
box-shadow:0 0 40px rgba(255,215,0,0.6);
animation:logoReveal 2.5s ease forwards;
}

@keyframes logoReveal{

0%{
opacity:0;
transform:scale(0.4);
filter:blur(10px);
}

60%{
transform:scale(1.1);
}

100%{
opacity:1;
transform:scale(1);
filter:blur(0);
}

}

/* Confetti */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<h1>Digital Inauguration Ceremony</h1>

<!-- College Logo -->
<img src="kalasalingam logo.png" class="collegeLogo">

<!-- Lamps -->

<div class="lamps">

<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>

</div>

<!-- Text -->

<div id="textReveal">

IEEE Student Branch  
<br><br>
KARE IEEE EMBS Student Chapter

</div>

<!-- EMBS Logo -->

<div id="logoSection">

<div class="logoContainer">

<img id="logo" src="logo.jpeg">

</div>

</div>

<canvas id="confetti"></canvas>

<script>

let count=0

function lightLamp(lamp){

if(lamp.classList.contains("lit")) return

lamp.classList.add("lit")

lamp.innerHTML="🪔<div class='flame'></div>"

count++

if(count==6){

document.getElementById("textReveal").style.opacity=1

setTimeout(showLogo,2500)

}

}

function showLogo(){

document.getElementById("logoSection").style.display="block"

startConfetti()

}

/* Confetti */

const canvas=document.getElementById("confetti")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

function startConfetti(){

for(let i=0;i<160;i++){

pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*6,
speed:Math.random()*3
})

}

animate()

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle="gold"
ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

if(p.y>canvas.height)p.y=0

})

requestAnimationFrame(animate)

}

</script>

</body>
</html>
