<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEEE EMBS Inauguration</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle at center,#081c3a,#020d1f);
color:white;
text-align:center;
overflow-x:hidden;
}

/* Title */

.title{
font-size:40px;
margin-top:40px;
font-weight:600;
letter-spacing:2px;
}

/* Lamp */

.lamp{
font-size:80px;
cursor:pointer;
transition:0.3s;
}

.lamp:hover{
transform:scale(1.2);
}

.flame{
width:15px;
height:30px;
background:linear-gradient(yellow,orange,red);
border-radius:50%;
margin:auto;
animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
0%{transform:scale(1)}
100%{transform:scale(1.2)}
}

.section{
margin-top:50px;
display:none;
}

button{
padding:12px 25px;
font-size:16px;
border:none;
border-radius:8px;
background:#f4b400;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#ffd54f;
}

/* Text reveal */

.reveal{
font-size:28px;
margin-top:20px;
animation:fadeIn 2s;
}

@keyframes fadeIn{
0%{opacity:0;transform:translateY(20px)}
100%{opacity:1}
}

/* Logo */

.logo{
width:200px;
opacity:0;
animation:logoReveal 3s forwards;
}

@keyframes logoReveal{
0%{opacity:0;transform:scale(0)}
100%{opacity:1;transform:scale(1)}
}

/* Guests */

.guests{
margin-top:40px;
}

.guestBtn{
background:#1565c0;
color:white;
margin:10px;
}

.guestLamp{
font-size:30px;
display:none;
}

/* Confetti */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>
</head>

<body>

<h1 class="title">Digital Inauguration Ceremony</h1>

<!-- STEP 1 -->

<div id="step1">

<div class="lamp" onclick="lightLamp1()">🪔</div>

<button onclick="lightLamp1()">Light the First Lamp</button>

<div id="flame1"></div>

<div id="text1" class="reveal"></div>

</div>


<!-- STEP 2 -->

<div id="step2" class="section">

<div class="lamp" onclick="lightLamp2()">🪔</div>

<button onclick="lightLamp2()">Light the Second Lamp</button>

<div id="flame2"></div>

<div id="text2" class="reveal"></div>

</div>


<!-- STEP 3 -->

<div id="step3" class="section">

<div class="lamp" onclick="lightLamp3()">🪔</div>

<button onclick="lightLamp3()">Light the Final Lamp</button>

<div id="flame3"></div>

<div id="text3" class="reveal"></div>

</div>


<!-- STEP 4 LOGO -->

<div id="logoSection" class="section">

<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/7e/IEEE-EMBS-Logo.png">

<h2>KARE IEEE EMBS Student Chapter</h2>

</div>


<!-- STEP 5 GUESTS -->

<div id="guestSection" class="section">

<h2>Ceremonial Lamp Lighting</h2>

<div class="guests">

<button class="guestBtn" onclick="guestLight(this)">Chief Guest</button>

<button class="guestBtn" onclick="guestLight(this)">Guest of Honour 1</button>

<button class="guestBtn" onclick="guestLight(this)">Guest of Honour 2</button>

<button class="guestBtn" onclick="guestLight(this)">Patron 1</button>

<button class="guestBtn" onclick="guestLight(this)">Patron 2</button>

<button class="guestBtn" onclick="guestLight(this)">IEEE Student Chair</button>

</div>

<div id="guestLamp" class="guestLamp">🪔</div>

</div>

<canvas id="confetti"></canvas>

<script>

/* Lamp functions */

function lightLamp1(){

document.getElementById("flame1").innerHTML="<div class='flame'></div>"

document.getElementById("text1").innerText="Kalasalingam Academy of Research and Education"

document.getElementById("step2").style.display="block"

}

function lightLamp2(){

document.getElementById("flame2").innerHTML="<div class='flame'></div>"

document.getElementById("text2").innerText="IEEE Student Branch"

document.getElementById("step3").style.display="block"

}

function lightLamp3(){

document.getElementById("flame3").innerHTML="<div class='flame'></div>"

document.getElementById("text3").innerText="KARE IEEE EMBS Student Chapter"

document.getElementById("logoSection").style.display="block"

document.getElementById("guestSection").style.display="block"

startConfetti()

}

/* Guest lamp */

function guestLight(btn){

btn.innerHTML="🪔 Lit"

btn.style.background="#2e7d32"

document.getElementById("guestLamp").style.display="block"

}

/* Confetti animation */

const canvas=document.getElementById("confetti")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

function startConfetti(){

for(let i=0;i<150;i++){

pieces.push({

x:Math.random()*canvas.width,

y:Math.random()*canvas.height,

size:Math.random()*6,

speed:Math.random()*3

})

}

animate()

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle="gold"

ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

if(p.y>canvas.height)p.y=0

})

requestAnimationFrame(animate)

}

</script>

</body>
</html>
