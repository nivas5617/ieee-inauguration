<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IEEE EMBS Digital Inauguration</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle,#0b1e3f,#020b1f);
color:white;
text-align:center;
overflow-x:hidden;
}

/* Title */

h1{
margin-top:40px;
font-size:42px;
letter-spacing:2px;
}

/* Lamp Section */

.lamps{
margin-top:60px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:40px;
}

.lamp{
font-size:80px;
cursor:pointer;
transition:0.3s;
}

.lamp:hover{
transform:scale(1.15);
}

/* Flame */

.flame{
width:15px;
height:30px;
margin:auto;
background:linear-gradient(yellow,orange,red);
border-radius:50%;
animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
0%{transform:scale(1)}
100%{transform:scale(1.2)}
}

/* Text Reveal */

#textReveal{
margin-top:60px;
font-size:28px;
opacity:0;
transition:2s;
line-height:1.6;
}

/* Logo Section */

#logoSection{
margin-top:80px;
display:none;
}

.logoContainer{
display:inline-block;
padding:20px;
}

/* Logo */

#logo{
width:260px;
opacity:0;
transform:scale(0.4);
border-radius:10px;
box-shadow:0 0 40px rgba(255,215,0,0.6);
animation:logoReveal 2.5s ease forwards;
}

/* Professional reveal animation */

@keyframes logoReveal{

0%{
opacity:0;
transform:scale(0.4);
filter:blur(10px);
}

60%{
transform:scale(1.1);
}

100%{
opacity:1;
transform:scale(1);
filter:blur(0);
}

}

/* Confetti */

canvas{
position:fixed;
top:0;
left:0;
pointer-events:none;
}

</style>

</head>

<body>

<h1>Digital Inauguration Ceremony</h1>

<!-- Lamps -->

<div class="lamps">

<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>
<div class="lamp" onclick="lightLamp(this)">🪔</div>

</div>

<!-- Text -->

<div id="textReveal">

Kalasalingam Academy of Research and Education
<br><br>
IEEE Student Branch
<br><br>
KARE IEEE EMBS Student Chapter

</div>

<!-- Logo -->

<div id="logoSection">

<div class="logoContainer">

<img id="logo" src="logo.jpeg">

</div>

</div>

<canvas id="confetti"></canvas>

<script>

/* Lamp Lighting */

let count=0

function lightLamp(lamp){

if(lamp.classList.contains("lit")) return

lamp.classList.add("lit")

lamp.innerHTML="🪔<div class='flame'></div>"

count++

if(count==6){

document.getElementById("textReveal").style.opacity=1

setTimeout(showLogo,2500)

}

}

/* Show Logo */

function showLogo(){

document.getElementById("logoSection").style.display="block"

startConfetti()

}

/* Confetti Animation */

const canvas=document.getElementById("confetti")

const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

function startConfetti(){

for(let i=0;i<160;i++){

pieces.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*6,
speed:Math.random()*3

})

}

animate()

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle="gold"

ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

if(p.y>canvas.height)p.y=0

})

requestAnimationFrame(animate)

}

</script>

</body>
</html>
